[project]
name = "mas-sql-course"
version = "0.1.8"
description = "Reproducible workflow, single-agent and sequential MAS BIRD SQLite experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mas-sql = "mas_sql.cli:main"

[tool.setuptools.packages.find]
include = ["mas_sql*"]
